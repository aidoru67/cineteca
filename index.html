<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Mia Cineteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* ── CONFIG: sostituisci con i tuoi valori Supabase ── */
  /* vedi istruzioni nel file README_DEPLOY.txt          */

  :root {
    --bg:        #0a0a0c;
    --surface:   #111115;
    --border:    #1e1e26;
    --accent:    #c8a96e;
    --accent2:   #7c6de8;
    --text:      #e8e4dc;
    --muted:     #5a5660;
    --card-bg:   #13131a;
    --tag-bg:    #1a1a24;
    --tag-active:#c8a96e22;
    --font-serif:'Cormorant Garamond', Georgia, serif;
    --font-mono: 'DM Mono', monospace;
    --radius:    4px;
    --transition: 200ms cubic-bezier(.4,0,.2,1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-serif);
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, #1a1428 0%, transparent 70%);
  }

  /* ── HEADER ── */
  header {
    padding: 4rem 2rem 2.5rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 39px, #ffffff04 39px, #ffffff04 40px
    );
    pointer-events: none;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: .7rem;
    letter-spacing: .25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  h1 {
    font-size: clamp(2.4rem, 6vw, 4.5rem);
    font-weight: 300;
    letter-spacing: -.01em;
    line-height: 1.1;
    color: var(--text);
  }
  h1 em {
    font-style: italic;
    color: var(--accent);
  }
  .subtitle {
    margin-top: .75rem;
    font-family: var(--font-mono);
    font-size: .75rem;
    color: var(--muted);
    letter-spacing: .08em;
  }

  /* ── CONTROLS ── */
  .controls {
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    background: rgba(10,10,12,.94);
  }

  /* top bar: always visible */
  .controls-bar {
    padding: .75rem 1rem;
    display: flex;
    align-items: center;
    gap: .6rem;
  }

  .search-wrap {
    position: relative;
    flex: 1;
  }
  .search-wrap svg {
    position: absolute;
    left: .75rem;
    top: 50%;
    transform: translateY(-50%);
    opacity: .35;
    pointer-events: none;
  }
  input[type="search"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: .85rem;
    padding: .55rem .75rem .55rem 2.2rem;
    outline: none;
    transition: border-color var(--transition);
    appearance: none;
    -webkit-appearance: none;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  input[type="search"]::placeholder { color: var(--muted); }

  /* genre toggle pill */
  .genre-toggle {
    display: flex;
    align-items: center;
    gap: .35rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .05em;
    padding: .55rem .75rem;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all var(--transition);
    -webkit-tap-highlight-color: transparent;
  }
  .genre-toggle.has-active { border-color: var(--accent); color: var(--accent); }
  .genre-toggle .arrow { transition: transform var(--transition); display: inline-block; }
  .genre-toggle.open .arrow { transform: rotate(180deg); }
  .genre-badge {
    background: var(--accent);
    color: #000;
    border-radius: 10px;
    font-size: .6rem;
    padding: .05rem .35rem;
    display: none;
  }
  .genre-toggle.has-active .genre-badge { display: inline; }

  .count {
    font-family: var(--font-mono);
    font-size: .68rem;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .count span { color: var(--accent); }

  /* tags panel — collapsible on all sizes, but auto-open on desktop */
  .tags-panel {
    overflow: hidden;
    max-height: 0;
    transition: max-height .3s cubic-bezier(.4,0,.2,1), padding .3s;
    padding: 0 1rem;
  }
  .tags-panel.open {
    max-height: 600px;
    padding: 0 1rem .75rem;
  }
  .tags-inner {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    padding-top: .5rem;
    border-top: 1px solid var(--border);
  }

  /* ── TAGS ── */
  .tag {
    font-family: var(--font-mono);
    font-size: .62rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    padding: .3rem .65rem;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: var(--tag-bg);
    color: var(--muted);
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    min-height: 32px;
    display: inline-flex;
    align-items: center;
  }
  .tag:hover  { color: var(--text); border-color: var(--muted); }
  .tag.active { background: var(--tag-active); border-color: var(--accent); color: var(--accent); }
  .tag-clear  { background: transparent; border-color: #2a2a2a; color: var(--muted); }
  .tag-clear:hover { border-color: #555; color: var(--text); }

  /* ── GRID ── */
  main {
    padding: 2rem;
    max-width: 1600px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1.25rem;
  }

  /* ── CARD ── */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
    animation: fadeUp .35s ease both;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: #2e2e3e;
    box-shadow: 0 16px 40px rgba(0,0,0,.5), 0 0 0 1px var(--accent)22;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(12px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .card-poster {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    display: block;
    background: var(--border);
    position: relative;
  }
  .poster-fallback {
    width: 100%;
    aspect-ratio: 2/3;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    padding: 1rem;
  }
  .poster-fallback svg { opacity: .15; }
  .poster-fallback span {
    font-size: .7rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.3;
    font-family: var(--font-mono);
  }

  .card-body {
    padding: .75rem;
  }
  .card-title {
    font-size: .95rem;
    font-weight: 400;
    line-height: 1.3;
    color: var(--text);
    margin-bottom: .3rem;
  }
  .card-meta {
    font-family: var(--font-mono);
    font-size: .65rem;
    color: var(--muted);
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .card-year { color: var(--accent); }
  .card-genres {
    margin-top: .5rem;
    display: flex;
    flex-wrap: wrap;
    gap: .3rem;
  }
  .card-tag {
    font-family: var(--font-mono);
    font-size: .55rem;
    letter-spacing: .04em;
    padding: .15rem .4rem;
    border-radius: 2px;
    background: var(--tag-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    text-transform: uppercase;
  }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    backdrop-filter: blur(6px);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-width: 680px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    gap: 0;
    transform: translateY(16px) scale(.98);
    transition: transform .25s cubic-bezier(.4,0,.2,1);
  }
  .modal-overlay.open .modal {
    transform: translateY(0) scale(1);
  }
  .modal-poster {
    width: 180px;
    min-width: 180px;
    object-fit: cover;
    border-radius: var(--radius) 0 0 var(--radius);
  }
  .modal-no-poster {
    width: 180px;
    min-width: 180px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius) 0 0 var(--radius);
  }
  .modal-no-poster svg { opacity:.1; }
  .modal-content {
    padding: 1.75rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: .75rem;
    min-width: 0;
  }
  .modal-title {
    font-size: 1.5rem;
    font-weight: 400;
    line-height: 1.2;
  }
  .modal-director {
    font-family: var(--font-mono);
    font-size: .72rem;
    color: var(--muted);
    letter-spacing: .06em;
  }
  .modal-director span { color: var(--accent); }
  .modal-tags { display: flex; flex-wrap: wrap; gap: .35rem; }
  .modal-tag {
    font-family: var(--font-mono);
    font-size: .62rem;
    letter-spacing: .05em;
    padding: .2rem .6rem;
    border-radius: 2px;
    background: var(--tag-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    text-transform: uppercase;
    cursor: pointer;
    transition: all var(--transition);
    -webkit-tap-highlight-color: transparent;
  }
  .modal-tag:hover { border-color: var(--accent); color: var(--accent); }
  .modal-synopsis {
    font-size: .9rem;
    color: #a09898;
    line-height: 1.7;
    font-style: italic;
  }
  .modal-close {
    align-self: flex-end;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: .65rem;
    letter-spacing: .08em;
    padding: .35rem .8rem;
    cursor: pointer;
    border-radius: var(--radius);
    margin-top: auto;
    transition: all var(--transition);
    text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
  }
  .modal-close:hover { border-color: var(--muted); color: var(--text); }

  /* ── EMPTY / LOADING ── */
  .state-msg {
    grid-column: 1/-1;
    text-align: center;
    padding: 5rem 2rem;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: .8rem;
    letter-spacing: .1em;
  }
  .state-msg strong { display: block; font-size: 2rem; opacity: .1; margin-bottom: 1rem; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ══════════════════════════════════
     DESKTOP: tags panel auto-aperto
  ══════════════════════════════════ */
  @media (min-width: 641px) {
    .controls-bar { padding: .85rem 2rem; }
    .tags-panel.open { padding: 0 2rem .85rem; }
    .genre-toggle { font-size: .7rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    main { padding: 2rem; }
  }

  /* ══════════════════════════════════
     MOBILE
  ══════════════════════════════════ */
  @media (max-width: 640px) {

    header { padding: 1.75rem 1rem 1.25rem; }
    h1 { font-size: 1.9rem; }
    .eyebrow { font-size: .58rem; margin-bottom: .5rem; }
    .subtitle { font-size: .65rem; }

    main { padding: .6rem; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: .5rem; }

    .card-body { padding: .55rem .6rem .65rem; }
    .card-title { font-size: .82rem; }
    .card-meta  { font-size: .58rem; gap: .3rem; }
    .card-genres { display: none; }

    /* Modal → bottom sheet */
    .modal-overlay { align-items: flex-end; padding: 0; }
    .modal {
      flex-direction: column;
      max-width: 100%;
      max-height: 88vh;
      border-radius: 16px 16px 0 0;
      border-bottom: none;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal::before {
      content: '';
      display: block;
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: .65rem auto 0;
      flex-shrink: 0;
    }
    .modal-poster {
      width: 100%; min-width: unset;
      height: 220px;
      object-fit: cover; object-position: center top;
      border-radius: 0; flex-shrink: 0;
    }
    .modal-no-poster {
      width: 100%; min-width: unset;
      height: 100px; border-radius: 0;
    }
    .modal-content { padding: 1.1rem 1.1rem 1.75rem; gap: .6rem; }
    .modal-title { font-size: 1.2rem; }
    .modal-close { align-self: stretch; text-align: center; padding: .8rem; font-size: .7rem; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Collezione personale</p>
  <h1>La Mia <em>Cineteca</em></h1>
  <p class="subtitle" id="header-count">caricamento…</p>
</header>

<div class="controls">
  <div class="controls-bar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" id="search" placeholder="Cerca titolo, regista…" autocomplete="off">
    </div>
    <button class="genre-toggle" id="genre-toggle" onclick="togglePanel()">
      Generi <span class="arrow">▾</span><span class="genre-badge" id="genre-badge">0</span>
    </button>
    <span class="count" id="count"><span>0</span> film</span>
  </div>
  <div class="tags-panel" id="tags-panel">
    <div class="tags-inner" id="tags"></div>
  </div>
</div>

<main>
  <div class="grid" id="grid">
    <div class="state-msg"><strong>⬤</strong>Connessione a Supabase…</div>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal" role="dialog">
    <div id="modal-inner"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════
//  ⚙️  CONFIGURA QUI I TUOI VALORI SUPABASE
// ══════════════════════════════════════════════════
const SUPABASE_URL  = 'https://amehnlagrydfilqhpdtk.supabase.co';
const SUPABASE_ANON = 'sb_publishable_c3RMIc7jFuNvwqvEygL7AQ_ny1S4IpG';
// ══════════════════════════════════════════════════

let allFilms = [];
let activeGenres = new Set();
let searchQuery = '';

// ── Fetch ──
async function loadFilms() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/films?select=*&order=title.asc`,
      { headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` } }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allFilms = await res.json();
    buildTags();
    render();
    document.getElementById('header-count').textContent =
      `${allFilms.length} film · ordinati per titolo`;
  } catch (e) {
    document.getElementById('grid').innerHTML =
      `<div class="state-msg"><strong>!</strong>Errore: ${e.message}<br><small>Controlla SUPABASE_URL e SUPABASE_ANON nel file index.html</small></div>`;
  }
}

// ── Tags ──
function buildTags() {
  const all = new Set();
  allFilms.forEach(f => (f.genres || []).forEach(g => all.add(g)));
  const sorted = [...all].sort((a,b) => a.localeCompare(b, 'it'));

  const container = document.getElementById('tags');
  container.innerHTML = '';

  const clearBtn = document.createElement('button');
  clearBtn.className = 'tag tag-clear';
  clearBtn.textContent = '✕ tutti';
  clearBtn.onclick = () => { activeGenres.clear(); updateTagUI(); render(); };
  container.appendChild(clearBtn);

  sorted.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'tag';
    btn.dataset.genre = g;
    btn.textContent = g;
    btn.onclick = () => {
      if (activeGenres.has(g)) activeGenres.delete(g);
      else activeGenres.add(g);
      updateTagUI();
      render();
    };
    container.appendChild(btn);
  });

  // Auto-apri su desktop
  if (window.innerWidth >= 641) openPanel();
}

function updateTagUI() {
  document.querySelectorAll('.tag[data-genre]').forEach(b => {
    b.classList.toggle('active', activeGenres.has(b.dataset.genre));
  });
  const n = activeGenres.size;
  const toggle = document.getElementById('genre-toggle');
  const badge  = document.getElementById('genre-badge');
  toggle.classList.toggle('has-active', n > 0);
  badge.textContent = n;
}

// ── Panel toggle ──
function openPanel() {
  const panel  = document.getElementById('tags-panel');
  const toggle = document.getElementById('genre-toggle');
  panel.classList.add('open');
  toggle.classList.add('open');
}

function togglePanel() {
  const panel  = document.getElementById('tags-panel');
  const toggle = document.getElementById('genre-toggle');
  panel.classList.toggle('open');
  toggle.classList.toggle('open');
}

// ── Filter ──
function filtered() {
  const q = searchQuery.toLowerCase();
  return allFilms.filter(f => {
    if (activeGenres.size > 0) {
      const fg = f.genres || [];
      if (!fg.some(g => activeGenres.has(g))) return false;
    }
    if (q) {
      const hay = [f.title, f.director, f.synopsis].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

// ── Render grid ──
function render() {
  const films = filtered();
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  countEl.innerHTML = `<span>${films.length}</span> film`;

  if (!films.length) {
    grid.innerHTML = `<div class="state-msg"><strong>∅</strong>Nessun film trovato</div>`;
    return;
  }

  grid.innerHTML = '';
  films.forEach((f, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = `${Math.min(i * 20, 300)}ms`;

    const genres = (f.genres || []).slice(0, 3)
      .map(g => `<span class="card-tag">${g}</span>`).join('');

    const poster = f.poster_url
      ? `<img class="card-poster" src="${f.poster_url}" alt="${esc(f.title)}" loading="lazy"
             onerror="this.parentNode.innerHTML=fallbackPoster('${esc(f.title)}')">`
      : fallbackPoster(f.title);

    card.innerHTML = `
      ${poster}
      <div class="card-body">
        <div class="card-title">${esc(f.title)}</div>
        <div class="card-meta">
          <span class="card-year">${f.year || '—'}</span>
          ${f.director ? `<span>${esc(f.director)}</span>` : ''}
        </div>
        ${genres ? `<div class="card-genres">${genres}</div>` : ''}
      </div>`;

    card.onclick = () => openModal(f);
    grid.appendChild(card);
  });
}

function fallbackPoster(title) {
  return `<div class="poster-fallback">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
      <rect x="2" y="3" width="20" height="14" rx="2"/><path d="m8 21 4-4 4 4M12 17v4"/>
    </svg>
    <span>${esc(title)}</span>
  </div>`;
}

// ── Modal ──
function openModal(f) {
  const genres = (f.genres || [])
    .map(g => `<span class="modal-tag" onclick="filterByTag('${esc(g)}')">${g}</span>`).join('');

  const poster = f.poster_url
    ? `<img class="modal-poster" src="${f.poster_url}" alt="${esc(f.title)}">`
    : `<div class="modal-no-poster"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="3" width="20" height="14" rx="2"/></svg></div>`;

  document.getElementById('modal-inner').innerHTML = `
    ${poster}
    <div class="modal-content">
      <h2 class="modal-title">${esc(f.title)}</h2>
      <p class="modal-director">
        ${f.year ? `<span>${f.year}</span>` : ''}
        ${f.director ? ` · ${esc(f.director)}` : ''}
      </p>
      ${genres ? `<div class="modal-tags">${genres}</div>` : ''}
      ${f.synopsis ? `<p class="modal-synopsis">${esc(f.synopsis)}</p>` : ''}
      <button class="modal-close" onclick="closeModal()">Chiudi</button>
    </div>`;

  document.getElementById('modal').innerHTML = document.getElementById('modal-inner').outerHTML;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function filterByTag(g) {
  closeModal();
  if (!activeGenres.has(g)) { activeGenres.add(g); updateTagUI(); render(); }
  document.querySelector('.controls').scrollIntoView({ behavior: 'smooth' });
}

// ── Utils ──
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Events ──
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

loadFilms();
</script>
</body>
</html>
