<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cineteca — La mia collezione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#181824; --s1:#21212f; --s2:#2a2a3c; --s3:#333348;
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.16);
  --text:#f0eeff; --dim:#b0aec8; --muted:#6a6882;
  --gold:#d4a85a; --gold-dim:rgba(212,168,90,.13);
  --r:10px;
  --ffd:'Cormorant Garamond',Georgia,serif;
  --ffb:'DM Sans',system-ui,sans-serif;
  --ffm:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--ffb);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden}

.g-Azione       {--gc:#f07858;--gb:rgba(240,120,88,.16);--gd:rgba(240,120,88,.42)}
.g-Avventura    {--gc:#f0aa50;--gb:rgba(240,170,80,.16);--gd:rgba(240,170,80,.42)}
.g-Fantascienza {--gc:#60b0f8;--gb:rgba(96,176,248,.16);--gd:rgba(96,176,248,.42)}
.g-Horror       {--gc:#b870e8;--gb:rgba(184,112,232,.16);--gd:rgba(184,112,232,.42)}
.g-Dramma       {--gc:#e8c050;--gb:rgba(232,192,80,.16);--gd:rgba(232,192,80,.42)}
.g-Commedia     {--gc:#50d090;--gb:rgba(80,208,144,.16);--gd:rgba(80,208,144,.42)}
.g-Thriller     {--gc:#f05080;--gb:rgba(240,80,128,.16);--gd:rgba(240,80,128,.42)}
.g-Animazione   {--gc:#f060d8;--gb:rgba(240,96,216,.16);--gd:rgba(240,96,216,.42)}
.g-Storico      {--gc:#c09858;--gb:rgba(192,152,88,.16);--gd:rgba(192,152,88,.42)}
.g-Fantasy      {--gc:#9870f0;--gb:rgba(152,112,240,.16);--gd:rgba(152,112,240,.42)}
.g-Supereroi    {--gc:#5888f8;--gb:rgba(88,136,248,.16);--gd:rgba(88,136,248,.42)}
.g-Crime        {--gc:#f05858;--gb:rgba(240,88,88,.16);--gd:rgba(240,88,88,.42)}
.g-Biografico   {--gc:#98c848;--gb:rgba(152,200,72,.16);--gd:rgba(152,200,72,.42)}
.g-Guerra       {--gc:#909878;--gb:rgba(144,152,120,.16);--gd:rgba(144,152,120,.42)}
.g-Musicale     {--gc:#f058b0;--gb:rgba(240,88,176,.16);--gd:rgba(240,88,176,.42)}
.g-Romantico    {--gc:#f080a8;--gb:rgba(240,128,168,.16);--gd:rgba(240,128,168,.42)}
.g-Mistero      {--gc:#8068f0;--gb:rgba(128,104,240,.16);--gd:rgba(128,104,240,.42)}
.g-Spy          {--gc:#40c0d8;--gb:rgba(64,192,216,.16);--gd:rgba(64,192,216,.42)}
.g-Heist        {--gc:#d8a048;--gb:rgba(216,160,72,.16);--gd:rgba(216,160,72,.42)}
.g-Western      {--gc:#d88858;--gb:rgba(216,136,88,.16);--gd:rgba(216,136,88,.42)}
.g-Italiano     {--gc:#20c070;--gb:rgba(32,192,112,.16);--gd:rgba(32,192,112,.42)}
.g-Cyberpunk    {--gc:#18d8c8;--gb:rgba(24,216,200,.16);--gd:rgba(24,216,200,.42)}
.g-Noir         {--gc:#a0a0c0;--gb:rgba(160,160,192,.16);--gd:rgba(160,160,192,.42)}
.g-Epico        {--gc:#c89038;--gb:rgba(200,144,56,.16);--gd:rgba(200,144,56,.42)}
.g-Rock         {--gc:#e85068;--gb:rgba(232,80,104,.16);--gd:rgba(232,80,104,.42)}
.g-Psicologico  {--gc:#a858b0;--gb:rgba(168,88,176,.16);--gd:rgba(168,88,176,.42)}
.g-default      {--gc:#8888a8;--gb:rgba(136,136,168,.16);--gd:rgba(136,136,168,.42)}

.site-header{position:sticky;top:0;z-index:100;background:rgba(24,24,36,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 clamp(14px,4vw,52px)}
.header-inner{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:14px;height:58px}
.logo{font-family:var(--ffd);font-size:clamp(1rem,2.4vw,1.35rem);font-weight:300;letter-spacing:.2em;color:var(--gold);white-space:nowrap;text-transform:uppercase}
.logo b{font-weight:600}
.pill{font-family:var(--ffm);font-size:10px;color:var(--muted);background:var(--s2);padding:2px 9px;border-radius:20px;border:1px solid var(--border);white-space:nowrap}
.search-wrap{flex:1;max-width:360px;margin-left:auto;position:relative}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#searchInput{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--ffb);font-size:13px;padding:8px 11px 8px 34px;outline:none;transition:border-color .2s,box-shadow .2s}
#searchInput::placeholder{color:var(--muted)}
#searchInput:focus{border-color:rgba(212,168,90,.45);box-shadow:0 0 0 3px rgba(212,168,90,.08)}

.hero{text-align:center;padding:clamp(36px,6vw,80px) clamp(14px,4vw,52px) clamp(20px,3vw,40px);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 65% 50% at 50% 0%,rgba(212,168,90,.07) 0%,transparent 70%);pointer-events:none}
.hero h1{font-family:var(--ffd);font-size:clamp(2rem,6.5vw,5rem);font-weight:300;letter-spacing:.02em;line-height:1;color:var(--text)}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p{color:var(--dim);font-size:clamp(.8rem,1.6vw,.92rem);margin-top:8px;max-width:360px;margin-inline:auto}

.controls{padding:0 clamp(14px,4vw,52px) 18px;max-width:1440px;margin:0 auto}
.sort-row{display:flex;align-items:center;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.sort-label{color:var(--muted);font-size:10px;font-family:var(--ffm);text-transform:uppercase;letter-spacing:.1em}
.sort-btn{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--dim);font-size:12px;padding:5px 11px;cursor:pointer;transition:all .18s;font-family:var(--ffb)}
.sort-btn.active,.sort-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
.filters-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.f-label{color:var(--muted);font-size:10px;font-family:var(--ffm);text-transform:uppercase;letter-spacing:.1em;margin-right:2px}
.chip{border:1px solid transparent;border-radius:20px;padding:3px 11px;font-size:11px;cursor:pointer;transition:all .15s;font-family:var(--ffb);white-space:nowrap}
.chip.clear{background:var(--s2);border-color:var(--border);color:var(--dim)}
.chip.active{opacity:1!important}
.chip:not(.active){opacity:.6}
.chip:hover{opacity:1}

.grid-wrap{max-width:1440px;margin:0 auto;padding:0 clamp(14px,4vw,52px) 80px}
.results-bar{color:var(--muted);font-family:var(--ffm);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
.film-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(172px,100%),1fr));gap:14px}

.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;transition:transform .24s cubic-bezier(.2,.8,.3,1),box-shadow .24s,border-color .24s}
.card:hover{transform:translateY(-5px) scale(1.01);box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 0 1px rgba(212,168,90,.16);border-color:rgba(212,168,90,.22)}
.poster{aspect-ratio:2/3;position:relative;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .poster img{transform:scale(1.05)}
.poster-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:14px;text-align:center}
.ph-icon{font-size:1.8rem;opacity:.5}
.ph-title{font-family:var(--ffd);font-size:clamp(.65rem,1.8vw,.88rem);font-weight:400;line-height:1.2;color:rgba(255,255,255,.9)}
.ph-year{font-family:var(--ffm);font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.08em}
.rating-pill{position:absolute;bottom:7px;right:7px;z-index:2;background:rgba(24,24,36,.82);border:1px solid rgba(212,168,90,.3);border-radius:5px;font-family:var(--ffm);font-size:9px;color:var(--gold);padding:2px 6px;backdrop-filter:blur(6px)}
.card-body{padding:9px 11px 12px}
.card-title{font-family:var(--ffd);font-size:.84rem;font-weight:400;line-height:1.3;color:var(--text);margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-dir{font-family:var(--ffm);font-size:9px;color:var(--muted);margin-bottom:7px}
.card-tags{display:flex;flex-wrap:wrap;gap:3px}
.tag{font-size:9px;padding:2px 7px;border-radius:10px;font-family:var(--ffb);white-space:nowrap;background:var(--gb);border:1px solid var(--gd);color:var(--gc)}

.overlay{position:fixed;inset:0;z-index:200;background:rgba(12,12,20,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--s1);border:1px solid var(--border2);border-radius:16px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;position:relative;transform:translateY(16px) scale(.98);transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.overlay.open .modal{transform:none}
.modal-x{position:absolute;top:13px;right:13px;background:var(--s2);border:1px solid var(--border);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dim);transition:all .2s;z-index:5}
.modal-x:hover{border-color:var(--gold);color:var(--gold)}
.modal-top{display:flex}
.modal-poster{width:175px;flex-shrink:0;border-radius:16px 0 0 0;overflow:hidden;background:var(--s2)}
.modal-poster img{width:100%;height:100%;object-fit:cover;display:block;min-height:262px}
.modal-poster-ph{width:100%;min-height:262px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.modal-poster-ph .mph-icon{font-size:2.8rem;opacity:.45}
.modal-poster-ph .mph-title{font-family:var(--ffd);font-size:1rem;line-height:1.2;color:rgba(255,255,255,.75)}
.modal-info{flex:1;padding:26px 24px 26px;min-width:0}
.modal-title{font-family:var(--ffd);font-size:clamp(1.3rem,3.5vw,2rem);font-weight:400;line-height:1.15;color:var(--text);margin-bottom:6px;padding-right:28px}
.modal-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.meta-year{font-family:var(--ffm);font-size:12px;color:var(--muted)}
.meta-rating{font-family:var(--ffm);font-size:12px;color:var(--gold);background:var(--gold-dim);padding:2px 9px;border-radius:20px}
.meta-dir{font-size:12px;color:var(--dim);width:100%}
.modal-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:18px}
.modal-synopsis{font-size:13px;line-height:1.78;color:var(--dim)}

.spinner{grid-column:1/-1;display:flex;align-items:center;justify-content:center;padding:80px 0;gap:10px;color:var(--muted);font-size:13px}
.spin{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{grid-column:1/-1;text-align:center;padding:80px 20px}
.empty h3{font-family:var(--ffd);font-size:1.8rem;font-weight:300;color:var(--dim);margin-bottom:8px}
.empty p{color:var(--muted);font-size:.9rem}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px}

@media(max-width:580px){.modal-top{flex-direction:column}.modal-poster{width:100%;border-radius:16px 16px 0 0}.modal-poster img,.modal-poster-ph{min-height:180px;max-height:220px}}
@media(max-width:380px){.film-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Cine<b>teca</b></div>
    <div class="pill" id="totalPill">…</div>
    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="searchInput" placeholder="Cerca film, regista, genere…" autocomplete="off">
    </div>
  </div>
</header>

<section class="hero">
  <h1>La mia<br><em>Collezione</em></h1>
  <p>Esplora, filtra per genere e leggi le sinossi</p>
</section>

<div class="controls">
  <div class="sort-row">
    <span class="sort-label">Ordina</span>
    <button class="sort-btn active" data-sort="title">A → Z</button>
    <button class="sort-btn" data-sort="year-desc">Anno ↓</button>
    <button class="sort-btn" data-sort="year-asc">Anno ↑</button>
    <button class="sort-btn" data-sort="rating">★ Rating</button>
  </div>
  <div class="filters-row" id="genreFilters">
    <span class="f-label">Genere</span>
    <button class="chip clear active" data-genre="all">Tutti</button>
  </div>
</div>

<div class="grid-wrap">
  <div class="results-bar" id="resultsBar"></div>
  <div class="film-grid" id="filmGrid">
    <div class="spinner"><div class="spin"></div> Caricamento…</div>
  </div>
</div>

<div class="overlay" id="filmOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-x" onclick="closeModal()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="modal-top">
      <div class="modal-poster" id="mPoster"></div>
      <div class="modal-info">
        <h2 class="modal-title" id="mTitle"></h2>
        <div class="modal-meta" id="mMeta"></div>
        <div class="modal-tags" id="mTags"></div>
        <p class="modal-synopsis" id="mSynopsis"></p>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://amehnlagrydfilqhpdtk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_c3RMIc7jFuNvwqvEygL7AQ_ny1S4IpG';
const OMDB_KEY     = '82912317';
const SB = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const GENRE_CSS = {"Azione":"g-Azione","Avventura":"g-Avventura","Fantascienza":"g-Fantascienza","Horror":"g-Horror","Dramma":"g-Dramma","Commedia":"g-Commedia","Thriller":"g-Thriller","Animazione":"g-Animazione","Storico":"g-Storico","Fantasy":"g-Fantasy","Supereroi":"g-Supereroi","Crime":"g-Crime","Biografico":"g-Biografico","Guerra":"g-Guerra","Musicale":"g-Musicale","Romantico":"g-Romantico","Mistero":"g-Mistero","Spy":"g-Spy","Heist":"g-Heist","Western":"g-Western","Italiano":"g-Italiano","Cyberpunk":"g-Cyberpunk","Noir":"g-Noir","Epico":"g-Epico","Rock":"g-Rock","Psicologico":"g-Psicologico"};
const GENRE_ICONS = {"Azione":"⚡","Avventura":"🗺️","Fantascienza":"🚀","Horror":"💀","Dramma":"🎭","Commedia":"😄","Thriller":"🔪","Animazione":"🎨","Storico":"📜","Fantasy":"🧙","Supereroi":"🦸","Crime":"🔫","Biografico":"📖","Guerra":"⚔️","Musicale":"🎵","Romantico":"❤️","Mistero":"🔍","Spy":"🕵️","Heist":"💰","Western":"🤠","Space Opera":"⭐","Monster Movie":"👾","Cyberpunk":"🤖","Italiano":"🇮🇹","Rock":"🎸","Psicologico":"🧠","Noir":"🎩","Epico":"🏛️"};
const CARD_RGB = {"Azione":"240,120,88","Avventura":"240,170,80","Fantascienza":"96,176,248","Horror":"184,112,232","Dramma":"232,192,80","Commedia":"80,208,144","Thriller":"240,80,128","Animazione":"240,96,216","Storico":"192,152,88","Fantasy":"152,112,240","Supereroi":"88,136,248","Crime":"240,88,88","Biografico":"152,200,72","Guerra":"144,152,120","Musicale":"240,88,176","Romantico":"240,128,168","Mistero":"128,104,240","Spy":"64,192,216","Heist":"216,160,72","Western":"216,136,88","Italiano":"32,192,112","Cyberpunk":"24,216,200","Noir":"160,160,192","Epico":"200,152,56","Rock":"232,80,104","Psicologico":"168,88,176"};

function gCls(g)  { return GENRE_CSS[g] || 'g-default'; }
function gIcon(g) { for(const[k,v] of Object.entries(GENRE_ICONS)) if(g.includes(k)) return v; return '🎬'; }
function cardBg(genres) {
  const r1 = CARD_RGB[genres[0]] || '136,136,168';
  const r2 = CARD_RGB[genres[1]] || r1;
  return `linear-gradient(145deg,rgba(${r1},.5) 0%,rgba(${r2},.28) 55%,#21212f 100%)`;
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let FILMS=[], state={filter:'all',sort:'title',search:''}, posterCache={}, posterQueue=[], posterBusy=false;

async function fetchFilms(){
  const{data,error}=await SB.from('films').select('*').order('title');
  if(error){document.getElementById('filmGrid').innerHTML=`<div class="empty"><h3>Errore connessione</h3><p>${error.message}</p></div>`;return;}
  FILMS=data||[];
  document.getElementById('totalPill').textContent=FILMS.length+' film';
  buildFilters(); render(); schedulePosters();
}

function buildFilters(){
  const wrap=document.getElementById('genreFilters');
  Array.from(wrap.querySelectorAll('.chip:not(.clear)')).forEach(b=>b.remove());
  [...new Set(FILMS.flatMap(f=>f.genres||[]))].sort().forEach(g=>{
    const b=document.createElement('button');
    b.className=`chip ${gCls(g)}`;b.dataset.genre=g;b.textContent=g;
    b.style.cssText='background:var(--gb);border-color:var(--gd);color:var(--gc)';
    b.addEventListener('click',()=>setFilter(g));
    wrap.appendChild(b);
  });
}
function setFilter(g){
  state.filter=g;
  document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.genre===g));
  render();
}

function getFiltered(){
  let f=[...FILMS];
  const q=state.search.toLowerCase();
  if(q) f=f.filter(x=>x.title.toLowerCase().includes(q)||(x.director||'').toLowerCase().includes(q)||(x.genres||[]).some(g=>g.toLowerCase().includes(q)));
  if(state.filter!=='all') f=f.filter(x=>(x.genres||[]).includes(state.filter));
  if(state.sort==='title')     f.sort((a,b)=>a.title.localeCompare(b.title,'it'));
  if(state.sort==='year-desc') f.sort((a,b)=>b.year-a.year);
  if(state.sort==='year-asc')  f.sort((a,b)=>a.year-b.year);
  if(state.sort==='rating')    f.sort((a,b)=>(b.rating||0)-(a.rating||0));
  return f;
}

function render(){
  const films=getFiltered();
  document.getElementById('resultsBar').textContent=films.length===FILMS.length?`${FILMS.length} film`:`${films.length} di ${FILMS.length} film`;
  const grid=document.getElementById('filmGrid');
  if(!films.length){grid.innerHTML=`<div class="empty"><h3>Nessun risultato</h3><p>Cambia filtri o ricerca</p></div>`;return;}
  grid.innerHTML='';
  films.forEach(film=>{
    const card=document.createElement('div');
    card.className='card';
    card.addEventListener('click',()=>openModal(film));
    const bg=cardBg(film.genres||[]);
    const priG=(film.genres||['Dramma'])[0];
    const imgSrc=film.poster_url||posterCache[film.imdb_id]||'';
    const tags=(film.genres||[]).slice(0,2).map(g=>`<span class="tag ${gCls(g)}" style="background:var(--gb);border-color:var(--gd);color:var(--gc)">${g}</span>`).join('');
    card.innerHTML=`
      <div class="poster">
        ${imgSrc?`<img src="${imgSrc}" alt="${esc(film.title)}" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:'' }
        <div class="poster-ph" style="background:${bg};${imgSrc?'display:none':''}">
          <div class="ph-icon">${gIcon(priG)}</div>
          <div class="ph-title">${esc(film.title)}</div>
          <div class="ph-year">${film.year||''}</div>
        </div>
        ${film.rating?`<div class="rating-pill">★ ${film.rating}</div>`:''}
      </div>
      <div class="card-body">
        <div class="card-title">${esc(film.title)}</div>
        <div class="card-dir">${film.year||''} · ${(film.director||'').split(',')[0]}</div>
        <div class="card-tags">${tags}</div>
      </div>`;
    grid.appendChild(card);
  });
}

function openModal(film){
  const bg=cardBg(film.genres||[]);
  const imgSrc=film.poster_url||posterCache[film.imdb_id]||'';
  const priG=(film.genres||['Dramma'])[0];
  document.getElementById('mPoster').innerHTML=imgSrc
    ?`<img src="${imgSrc}" alt="${esc(film.title)}" onerror="this.style.display='none'">`
    :`<div class="modal-poster-ph" style="background:${bg}"><div class="mph-icon">${gIcon(priG)}</div><div class="mph-title">${esc(film.title)}</div></div>`;
  document.getElementById('mPoster').style.background=bg;
  document.getElementById('mTitle').textContent=film.title;
  document.getElementById('mMeta').innerHTML=
    `${film.year?`<span class="meta-year">${film.year}</span>`:''}
     ${film.rating?`<span class="meta-rating">★ ${film.rating}</span>`:''}
     ${film.director?`<span class="meta-dir">Regia: ${film.director}</span>`:''}`;
  document.getElementById('mTags').innerHTML=(film.genres||[]).map(g=>
    `<span class="tag ${gCls(g)}" style="font-size:11px;padding:3px 10px;background:var(--gb);border-color:var(--gd);color:var(--gc)">${g}</span>`).join('');
  document.getElementById('mSynopsis').textContent=film.synopsis||'';
  document.getElementById('filmOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('filmOverlay').classList.remove('open');
  document.body.style.overflow='';
}

function schedulePosters(){
  posterQueue=FILMS.filter(f=>f.imdb_id&&!f.poster_url&&!posterCache[f.imdb_id]);
  if(!posterBusy) loadNextPoster();
}
async function loadNextPoster(){
  if(!posterQueue.length){posterBusy=false;return;}
  posterBusy=true;
  const film=posterQueue.shift();
  try{
    const r=await fetch(`https://www.omdbapi.com/?i=${film.imdb_id}&apikey=${OMDB_KEY}`);
    const d=await r.json();
    if(d.Poster&&d.Poster!=='N/A'){
      posterCache[film.imdb_id]=d.Poster;
      SB.from('films').update({poster_url:d.Poster}).eq('id',film.id);
      document.querySelectorAll('.film-grid .card').forEach(card=>{
        const t=card.querySelector('.card-title');
        if(t&&t.textContent===film.title){
          const pDiv=card.querySelector('.poster');
          if(!pDiv.querySelector('img')){
            const img=document.createElement('img');
            img.src=d.Poster;img.alt=film.title;img.loading='lazy';
            pDiv.insertBefore(img,pDiv.querySelector('.poster-ph'));
          }
          const ph=pDiv.querySelector('.poster-ph');
          if(ph) ph.style.display='none';
        }
      });
    }
  }catch(e){}
  setTimeout(loadNextPoster,90);
}

document.querySelectorAll('.sort-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');state.sort=btn.dataset.sort;render();
  });
});
document.querySelector('.chip.clear').addEventListener('click',()=>setFilter('all'));
let st;
document.getElementById('searchInput').addEventListener('input',e=>{
  clearTimeout(st);st=setTimeout(()=>{state.search=e.target.value.trim();render();},220);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

fetchFilms();
</script>
</body>
</html>
